services:
  plate-api:
    build: .
    container_name: plate-recognition-api
    env_file: .env
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    volumes:
      # cache model EasyOCR agar tidak re-download tiap rebuild container
      - easyocr-models:/root/.EasyOCR
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(f\"http://127.0.0.1:{os.getenv('APP_PORT','5000')}/health\")"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  easyocr-models:
